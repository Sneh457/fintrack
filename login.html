{% extends 'base.html' %}

{% block content %}
<div class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full p-8 rounded-2xl shadow-glass">
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
        
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="px-4 py-2 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-medium mb-2" for="username">
                    Username
                </label>
                <input class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500" 
                       id="username" name="username" type="text" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2" for="password">
                    Password
                </label>
                <input class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500" 
                       id="password" name="password" type="password" required>
            </div>
            <button type="submit" class="w-full bg-primary-600 text-white py-2 px-4 rounded-md hover:bg-primary-700 transition-colors">
                Login
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <p class="text-gray-600 text-sm">Don't have an account? 
                <a href="{% url 'signup' %}" class="text-primary-600 hover:text-primary-800 font-medium">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
